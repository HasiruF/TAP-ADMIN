# Local production-parity run. Values come from a local .env file (see
# .env.example). NEXT_PUBLIC_* are build args (baked in); BACKEND_API_URL is a
# runtime env var read by the Next.js server (BFF route handlers).
services:
  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PLATFORM_URL: ${NEXT_PUBLIC_PLATFORM_URL}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: ${BACKEND_API_URL}
    restart: unless-stopped
